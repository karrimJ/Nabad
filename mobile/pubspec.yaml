name: mobile
description: "Nabd Thermocare Flutter App"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  app_settings: ^7.0.0

  flutter:
    sdk: flutter

  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.8

  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.0.0

  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  cloud_functions: ^6.0.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0

  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.2
  flutter_blue_plus: ^2.2.3
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Regular.ttf
        - asset: assets/fonts/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Alexandria-Bold.ttf
          weight: 700
